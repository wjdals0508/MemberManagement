spring:
  application:
    name: MemberManagement
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO


---
# ===== 로컬 개발 (H2) =====
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    aws:
      s3:
        region: ap-northeast-2
      credentials:
        access-key: dummy
        secret-key: dummy
---
# ===== 로컬 Docker MySQL =====
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://localhost:3307/test
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 12345678

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    aws:
      s3:
        enabled: false
---
# ===== 운영 (AWS RDS + Parameter Store) =====
spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/member-management/prod/

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/member_management
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  cloud:
    aws:
      s3:
        region: ap-northeast-2

info:
  app:
    message: ${APP_MESSAGE}

app:
  s3:
    bucket-name: ${S3_BUCKET_NAME}